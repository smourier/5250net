name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build
        run: dotnet build 5250net.slnx -c Release
      - name: Protocol tests
        run: dotnet run --project tests/Terminal5250.Tests -c Release -p:PublishAot=false
      - name: Native AOT publish
        run: dotnet publish src/Terminal5250 -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - name: Native smoke test on Windows
        if: runner.os == 'Windows'
        run: .\artifacts\${{ matrix.rid }}\5250net.exe --help
      - name: Native smoke test on Linux
        if: runner.os == 'Linux'
        run: ./artifacts/${{ matrix.rid }}/5250net --help
      - uses: actions/upload-artifact@v4
        with:
          name: 5250net-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
